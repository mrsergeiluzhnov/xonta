# Стенд «Репутация» (Georeview) — так же изолированно: свой проект, без портов, ограничения ресурсов.
name: xonta-stand-geo
services:
  stand-geo:
    build:
      context: ..
      dockerfile: Dockerfile
    image: xonta-stand:0.4.0
    container_name: xonta-stand-geo
    user: "${STAND_UID:-1000}:${STAND_GID:-1000}"
    restart: on-failure:3
    env_file: ../stand.env
    environment:
      STAND_DIR: /stand-data/geo
      ROUND_PAUSE_MIN: "${GEO_ROUND_PAUSE_MIN:-10}"
      SIGNAL_C_GAP: "${GEO_SIGNAL_C_GAP:-15}"
    command: ["node", "stand/geo-run.js"]
    volumes:
      - ../stand-data:/stand-data
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
