};
const TYPE_NAMES = {
  AgentDomainControl: ["Контроль домена", "Domain control"],
  AgentMcpScan: ["Проверка инструментов MCP", "MCP tool scan"],
  AgentEvaluation: ["Экзамен", "Evaluation"],
  AgentFieldEvaluation: ["Экзамен по сфере", "Field evaluation"],
  AgentReputation: ["Репутация", "Reputation"],
  AgentOwnerVerified: ["Владелец проверен", "Owner verified"],
  ActionMandate: ["Мандат на действия", "Action mandate"],
};
const XONTA_ISSUERS = ["did:web:orchestrator.xonta.dev", "did:web:passport.xonta.ru"];
// оркестратор Xonta переехал с passport.xonta.ru на orchestrator.xonta.dev с тем же ключом: старые аттестаты остаются действительными
const ALIASES = { "did:web:passport.xonta.ru": "did:web:orchestrator.xonta.dev" };
const canon = (did) => { if (typeof did !== "string") return did; for (const [a, b] of Object.entries(ALIASES)) if (did === a || did.startsWith(a + ":")) return b + did.slice(a.length); return did; };
const DEFAULT_ORCH = "https://orchestrator.xonta.dev";

// ---------- крипто / crypto ----------
// RFC 8785 JCS, совпадает с пакетом canonicalize на сервере
function jcs(v) {
  if (v === null || typeof v !== "object") {
    if (typeof v === "number" && !isFinite(v)) throw new Error("JCS: number");
    return JSON.stringify(v);
  }
  if (typeof v.toJSON === "function") return jcs(v.toJSON());
  if (Array.isArray(v)) return "[" + v.map((x) => (x === undefined || typeof x === "function" ? "null" : jcs(x))).join(",") + "]";
  return "{" + Object.keys(v).sort().filter((k) => v[k] !== undefined && typeof v[k] !== "function").map((k) => JSON.stringify(k) + ":" + jcs(v[k])).join(",") + "}";
}
const enc = new TextEncoder();
const sha256 = async (s) => new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(s)));
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function base58decode(s) {
  const bytes = [];
  for (const ch of s) {
    let carry = B58.indexOf(ch);
    if (carry < 0) throw new Error("base58");
    for (let j = 0; j < bytes.length; j++) { carry += bytes[j] * 58; bytes[j] = carry & 255; carry >>= 8; }
    while (carry) { bytes.push(carry & 255); carry >>= 8; }
  }
  for (const ch of s) { if (ch !== "1") break; bytes.push(0); }
  return new Uint8Array(bytes.reverse());
}
function fromMultibase58(s) { if (typeof s !== "string" || s[0] !== "z") throw new Error("multibase"); return base58decode(s.slice(1)); }
function b64url(s) {
  const b = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
  return Uint8Array.from(b, (c) => c.charCodeAt(0));
}
async function gunzip(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function didWebToUrl(did) {
  const m = /^did:web:([^#?]+)$/.exec(did || "");
  if (!m) throw new Error("not did:web");
  const parts = m[1].split(":").map(decodeURIComponent);
  const host = parts.shift();
  return parts.length ? `https://${host}/${parts.join("/")}/did.json` : `https://${host}/.well-known/did.json`;
}

const cache = new Map();
async function getJson(url) {
  if (!cache.has(url)) cache.set(url, (async () => {
    let r;
    try { r = await fetch(url, { headers: { accept: "application/json" }, credentials: "omit" }); }
    catch { throw new Error(L().errNet); }
    if (!r.ok) throw new Error(L().errHttp(r.status));
    try { return await r.json(); } catch { throw new Error(L().errJson); }
  })());
  return cache.get(url);
}

async function keyFor(vmId) {
  const did = vmId.split("#")[0];
  const doc = await getJson(didWebToUrl(did));
  if (doc.id !== did) throw new Error("DID document id mismatch");
  const allowed = [].concat(doc.assertionMethod || []).map((a) => (typeof a === "string" ? a : a.id));
  const vm = [].concat(doc.verificationMethod || []).find((v) => v.id === vmId) || [].concat(doc.assertionMethod || []).find((a) => typeof a === "object" && a.id === vmId);
  if (!vm || !allowed.includes(vmId)) throw new Error("key is not an assertionMethod");
  const mk = fromMultibase58(vm.publicKeyMultibase);
  if (mk.length !== 34 || mk[0] !== 0xed || mk[1] !== 0x01) throw new Error("not an Ed25519 Multikey");
  return crypto.subtle.importKey("raw", mk.slice(2), { name: "Ed25519" }, false, ["verify"]);
}

// eddsa-jcs-2022 (W3C vc-di-eddsa), как verifyProof на сервере
async function verifyProof(vc) {
  const proofs = [].concat(vc.proof || []);
  if (!proofs.length) return false;
  const issuer = typeof vc.issuer === "string" ? vc.issuer : vc.issuer?.id;
  let unknown = false;
  for (const p of proofs) {
    if (p?.type !== "DataIntegrityProof" || p.cryptosuite !== "eddsa-jcs-2022" || p.proofPurpose !== "assertionMethod") continue;
    if (p.verificationMethod?.split("#")[0] !== issuer) continue;
    const { proofValue, ...config } = p;
    const { proof: _p, ...unsecured } = vc;
    if (config["@context"] !== undefined) {
      const dc = [].concat(vc["@context"] || []), pc = [].concat(config["@context"]);
      if (pc.some((c, i) => JSON.stringify(c) !== JSON.stringify(dc[i]))) continue;
      unsecured["@context"] = config["@context"];
    }
    let key;
    try { key = await keyFor(p.verificationMethod); } catch { unknown = true; continue; }
    const h1 = await sha256(jcs(config)), h2 = await sha256(jcs(unsecured));
    const data = new Uint8Array(64); data.set(h1, 0); data.set(h2, 32);
    try { if (await crypto.subtle.verify({ name: "Ed25519" }, key, fromMultibase58(proofValue), data)) return true; } catch {}
  }
  return unknown ? null : false; // null — ключ издателя не получен, проверить нельзя
}

function dateCheck(vc, now = new Date()) {
  if (vc.validFrom && new Date(vc.validFrom) > now) return "future";
  if (vc.validUntil && new Date(vc.validUntil) < now) return "expired";
  return "ok";
}

const lists = new Map();
async function statusList(url, issuer) {
  if (!lists.has(url)) lists.set(url, (async () => {
    const vc = await getJson(url);
    const iss = typeof vc.issuer === "string" ? vc.issuer : vc.issuer?.id;
    if (iss !== issuer) throw new Error("status list from another issuer");
    if ((await verifyProof(vc)) !== true) throw new Error("status list signature");
    if (dateCheck(vc) !== "ok") throw new Error("status list expired");
    const s = vc.credentialSubject?.encodedList;
    if (typeof s !== "string" || s[0] !== "u") throw new Error("encodedList");
    return { purpose: vc.credentialSubject.statusPurpose, bits: await gunzip(b64url(s.slice(1))) };
  })());
  return lists.get(url);
}
// null — проверить не удалось; иначе { revocation, suspension }
async function checkStatus(vc) {
  const entries = [].concat(vc.credentialStatus || []).filter((e) => e?.type === "BitstringStatusListEntry");
  if (!entries.length) return { revocation: false, suspension: false };
  const out = { revocation: false, suspension: false };
  const issuer = typeof vc.issuer === "string" ? vc.issuer : vc.issuer?.id;
  try {
    for (const e of entries) {
      const l = await statusList(e.statusListCredential, issuer);
      if (l.purpose !== e.statusPurpose) throw new Error("purpose");
      const i = Number(e.statusListIndex);
      if (!Number.isInteger(i) || i < 0 || (i >> 3) >= l.bits.length) throw new Error("index");
      if ((l.bits[i >> 3] >> (7 - (i & 7))) & 1) out[e.statusPurpose] = true;
    }
    return out;
  } catch { return null; }
}
async function ed25519Supported() {
  try { await crypto.subtle.generateKey({ name: "Ed25519" }, false, ["sign", "verify"]); return true; } catch { return false; }
}

// ---------- проверка паспорта / passport check ----------
async function checkPassport(url) {
  if (!(await ed25519Supported())) throw Object.assign(new Error("nocrypto"), { nocrypto: true });
  const pp = await getJson(url);
  if (!pp || typeof pp !== "object" || !pp.passport || !Array.isArray(pp.credentials)) throw new Error(L().errJson);
  const agentDid = pp.passport.id, issuer = pp.passport.issuer;
  const creds = [];
  for (const raw of pp.credentials) {
    const { _status, _inclusion, ...vc } = raw;
    const iss = typeof vc.issuer === "string" ? vc.issuer : vc.issuer?.id;
    const type = [].concat(vc.type || []).find((t) => t !== "VerifiableCredential") || "?";
    const sig = await verifyProof(vc);
    const status = await checkStatus(vc);
    creds.push({ vc, type, sig, dates: dateCheck(vc), status, subjectOk: canon(vc.credentialSubject?.id) === canon(agentDid), issuerOk: canon(iss) === canon(issuer) });
  }
  return { pp, creds, issuer };
}

function summarize({ pp, creds }) {
  const usable = (c) => c.sig && c.subjectOk && c.issuerOk && c.dates === "ok" && c.status && !c.status.revocation && !c.status.suspension;
  if (creds.some((c) => c.sig === false || !c.subjectOk || !c.issuerOk)) return { cls: "bad", key: "badsig" };
  if (creds.some((c) => c.sig === null)) return { cls: "warn", key: "nokey" };
  const st = pp.passport.status;
  if (st === "revoked") return { cls: "bad", key: "revoked" };
  if (st === "suspended") return { cls: "warn", key: "suspended" };
  const dc = creds.filter((c) => c.type === "AgentDomainControl");
  const live = dc.filter(usable);
  if (live.length) {
    const until = live.map((c) => c.vc.validUntil).filter(Boolean).sort().at(-1);
    return { cls: "ok", key: "ok", until };
  }
  if (dc.some((c) => c.status && (c.status.revocation || c.status.suspension))) return { cls: "bad", key: "dcstatus" };
  return { cls: "warn", key: dc.length ? "expired" : "nodomain" };
}

// ---------- вывод / rendering ----------
let lang = new URLSearchParams(location.search).get("lang");
if (lang !== "en" && lang !== "ru") { try { lang = localStorage.getItem("xonta-lang"); } catch { lang = null; } }
if (lang !== "en" && lang !== "ru") lang = /^ru|^uk|^be|^kk/i.test(navigator.language || "") ? "ru" : "en";
const L = () => T[lang];
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtDate = (s) => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString(lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "long", year: "numeric" }).replace(/\s*г\.$/, ""); };
let last = null;

function applyStatic() {
  document.documentElement.lang = lang;
  document.title = (lang === "ru" ? "Паспорт агента" : "Agent passport") + " · Xonta";
  document.querySelectorAll("[data-t]").forEach((n) => { const v = L()[n.dataset.t]; if (typeof v === "string") n.textContent = v; });
  $("u").placeholder = L().placeholder;
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

function render(res, url) {
  const t = L();
  const { pp, creds } = res;
  $("agentName").textContent = pp.name || pp.passport.id;
  $("agentUrl").textContent = pp.url || "";
  const s = summarize(res);
  $("verdict").className = "verdict " + s.cls;
  $("vBig").textContent = t["v_" + s.key];
  const small = t["v_" + s.key + "Small"];
  $("vSmall").textContent = typeof small === "function" ? small(fmtDate(s.until)) : small;

  const facts = $("facts"); facts.replaceChildren();
  const add = (k, v, mono) => { if (v == null || v === "") return; facts.append(el("dt", null, k)); const dd = el("dd"); if (mono) dd.append(el("code", null, v)); else dd.textContent = v; facts.append(dd); };
  const p = pp.passport;
  add(t.f_status, t["st_" + p.status] || p.status);
  add(t.f_endpoint, pp.url, true);
  add(t.f_did, p.id, true);
  add(t.f_issuer, `${p.issuer.replace(/^did:web:/, "")} (${XONTA_ISSUERS.includes(p.issuer) ? t.issuerXonta : t.issuerOther})`);
  if (p.owner_level != null) add(t.f_owner, t["own" + p.owner_level] || p.owner_level_name);

  const ul = $("creds"); ul.replaceChildren();
  const order = ["AgentDomainControl", "AgentMcpScan", "AgentOwnerVerified", "AgentFieldEvaluation", "AgentEvaluation", "ActionMandate", "AgentReputation"];
  const sorted = [...creds].sort((a, b) => ((order.indexOf(a.type) + 99) % 99 - (order.indexOf(b.type) + 99) % 99) || String(b.vc.validFrom).localeCompare(String(a.vc.validFrom)));
  for (const c of sorted) {
    const li = el("li");
    const top = el("div", "top");
    const name = (TYPE_NAMES[c.type] || [c.type, c.type])[lang === "ru" ? 0 : 1];
    top.append(el("span", "name", name));
    let pill;
    if (c.sig === false || !c.subjectOk || !c.issuerOk) pill = ["bad", t.p_bad];
    else if (c.sig === null) pill = ["na", t.p_unknown];
    else if (c.status?.revocation) pill = ["bad", t.p_revoked];
    else if (c.status?.suspension) pill = ["warn", t.p_suspended];
    else if (c.dates !== "ok") pill = ["warn", t.p_expired];
    else pill = ["ok", t.p_valid];
    top.append(el("span", "pill " + pill[0], pill[1]));
    li.append(top);

    const sub = c.vc.credentialSubject || {};
    const line = [];
    if (c.type === "AgentDomainControl" && sub.domain) line.push(sub.domain);
    if (c.type === "AgentMcpScan") { if (sub.tools_count != null) line.push(t.tools(sub.tools_count)); line.push(t.findings((sub.findings || []).length)); }
    if (line.length) li.append(el("div", "muted", line.join(" · ")));

    const ch = el("ul", "checks");
    const item = (ok, text) => ch.append(el("li", ok === true ? "ok-t" : ok === false ? "bad-t" : "warn-t", (ok === true ? "✓ " : ok === false ? "✗ " : "! ") + text));
    item(c.sig, c.sig === true ? t.c_sig : c.sig === false ? t.c_sigBad : t.c_sigNa);
    if (c.dates === "ok") item(true, t.c_dates(fmtDate(c.vc.validFrom), c.vc.validUntil && fmtDate(c.vc.validUntil)));
    else if (c.dates === "expired") item(null, t.c_expired(fmtDate(c.vc.validUntil)));
    else item(null, t.c_future(fmtDate(c.vc.validFrom)));
    if (!c.status) item(null, t.c_statusNa);
    else if (c.status.revocation) item(false, t.c_revoked);
    else if (c.status.suspension) item(null, t.c_suspended);
    else item(true, t.c_status);
    item(c.subjectOk, c.subjectOk ? t.c_subject : t.c_subjectBad);
    if (!c.issuerOk) item(false, t.c_issuerBad);
    li.append(ch);
    const det = el("details"); det.append(el("summary", null, t.details)); det.append(el("pre", null, JSON.stringify(c.vc, null, 2)));
    li.append(det);
    ul.append(li);
  }

  const how = $("how"); how.replaceChildren();
  for (const h of t.how) how.append(el("li", null, typeof h === "function" ? h(p.issuer) : h));
  $("raw").href = url;
}

function renderFail(msg) {
  $("loading").hidden = true; $("result").hidden = true; $("fail").hidden = false;
  $("failWhy").textContent = msg;
}

function resolveTarget(q) {
  const v = (q || "").trim();
  if (/^ag_[a-z0-9]+$/i.test(v)) return `${DEFAULT_ORCH}/v1/agents/${v}/passport`;
  let u;
  try { u = new URL(v); } catch { return null; }
  if (u.protocol !== "https:" && !(u.protocol === "http:" && /^(localhost|127\.0\.0\.1)$/.test(u.hostname))) return null;
  return u.href;
}

async function run() {
  const q = new URLSearchParams(location.search);
  const id = q.get("id"), p = q.get("p");
  const orch = q.get("o");
  let target = null;
  if (p) target = resolveTarget(p);
  else if (id && /^ag_[a-z0-9]+$/i.test(id)) target = orch ? resolveTarget(`${orch.replace(/\/+$/, "")}/v1/agents/${id}/passport`) : resolveTarget(id);
  if (!p && !id) return;
  $("intro").hidden = true; $("out").hidden = false;
  if (!target) return renderFail(L().errUrl);
  try {
    last = { res: await checkPassport(target), url: target };
    $("loading").hidden = true; $("result").hidden = false;
    render(last.res, last.url);
  } catch (e) {
    if (e.nocrypto) { $("loading").hidden = true; $("result").hidden = true; $("fail").hidden = false; $("fail").querySelector(".big").textContent = L().v_nocrypto; $("failWhy").textContent = L().v_nocryptoSmall; return; }
    renderFail(e.message);
  }
}

document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("xonta-lang", lang); } catch {}
  applyStatic(); if (last) render(last.res, last.url);
}));
$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = $("u").value.trim();
  if (!resolveTarget(v)) { $("u").setCustomValidity(L().errUrl); $("u").reportValidity(); $("u").setCustomValidity(""); return; }
  const qs = /^ag_/i.test(v) ? `?id=${encodeURIComponent(v)}` : `?p=${encodeURIComponent(v)}`;
  location.search = qs + (lang === "en" ? "&lang=en" : "");
});
applyStatic();
run();
</script>
</body>
